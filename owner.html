<script>

try{var c0=JSON.parse(localStorage.getItem("ft_own_cache")||"null");if(c0){O=c0.O;S=c0.S;}}catch(e){}

function render(){if(!O){return;}$("upd").textContent="Updated "+O.at+(S?" · sales "+S.at:"");var x="",R=O.roaa||{},St=O.stock||{},F=O.farida||{},Di=O.dina||{},Ha=O.haidy||{},Cr=O.creators||{},D5=O.d5||{},RL=O.roaaLast;

else x+='<div class="card">'+(SE?"Sales could not load: "+h(SE):"Loading sales…")+'</div>';

if(TAB===1){x+=card("Roaa","returns + stock count",R.err?h(R.err):'<div class="g3">'+tl(R.n,"pieces waiting")+tl(R.today,"answered today")+tl(R.oldest+"d","oldest waiting")+'</div><div class="g3">'+tl(St.next?"Day "+St.next:"—","next count day")+tl(St.last,"last day ticked")+tl(St.since==null?"—":St.since+"d","since last count")+'</div>',app("Roaa"));
